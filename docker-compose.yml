services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pricing}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      retries: 6
  redis:
    image: redis:8.2.2-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      retries: 6
  api:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile}
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pricing}
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile}
    command: [node, apps/workers/dist/main.js]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pricing}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile}
    command: [node, apps/web/.next/standalone/apps/web/server.js]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
