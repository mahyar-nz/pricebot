name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: pricing
          POSTGRES_PASSWORD: ci-only-not-for-production
          POSTGRES_DB: pricing
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U pricing -d pricing"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://pricing:ci-only-not-for-production@127.0.0.1:54329/pricing
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: php -l integrations/wordpress/pricing-bridge/pricing-bridge.php && php tests/wordpress-bridge.php
      - run: python3 scripts/package-bridge.py
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=high
      - name: Local HTTP and OTP integration checks
        run: |
          node --env-file=.env apps/api/dist/main.js > api-test.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4000/api/v1/health
          pnpm test:e2e
          pnpm test:otp
