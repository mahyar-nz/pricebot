packages:
  - apps/*
  - packages/*
allowBuilds:
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@nestjs/core': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
